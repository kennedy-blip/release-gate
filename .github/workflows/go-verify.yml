name: Go verification
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
permissions:
  contents: write
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.23.x'
      - name: Format Go sources
        run: gofmt -w api/*.go cmd/server/*.go
      - name: Commit gofmt output
        run: |
          if ! git diff --quiet; then
            git config user.name github-actions[bot]
            git config user.email 41898282+github-actions[bot]@users.noreply.github.com
            git add api/*.go cmd/server/*.go
            git commit -m "style: gofmt Go sources"
            git push
          fi
      - name: Vet
        run: go vet ./api/...
      - name: Test
        run: go test ./...
      - name: Validate Vercel config
        run: python -m json.tool vercel.json >/dev/null
